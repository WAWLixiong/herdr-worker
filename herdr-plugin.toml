id = "herdr-worker"
name = "herdr-worker"
version = "0.1.0"
min_herdr_version = "0.7.0"
description = "Kanban for coding agents, backed by markdown in your repo"
platforms = ["linux", "macos", "windows"]

[[panes]]
id = "board"
title = "Board"
placement = "overlay"
command = ["target/release/herdr-worker", "board"]

# d 键的全屏 diff overlay：命令经 HW_DIFF_CMD 环境变量注入；q 退出 pager → overlay 合拢回板
[[panes]]
id = "diff"
title = "Diff"
placement = "overlay"
command = ["target/release/herdr-worker", "diff"]

[[actions]]
id = "open-board"
title = "Open Board"
contexts = ["global"]
command = ["target/release/herdr-worker", "act", "open-board"]

# 事件大脑（只注册携带状态信息的事件；worktree.created/opened 是编排自身动作，注册=白费进程）
[[events]]
on = "pane.agent_status_changed"
command = ["target/release/herdr-worker", "sync"]

[[events]]
on = "pane.exited"
command = ["target/release/herdr-worker", "sync"]

[[events]]
on = "worktree.removed"
command = ["target/release/herdr-worker", "sync"]
