id = "herdr-worker"
name = "herdr-worker"
version = "0.1.0"
min_herdr_version = "0.7.0"
description = "Kanban for coding agents, backed by markdown in your repo"
platforms = ["linux", "macos", "windows"]

[[panes]]
id = "board"
title = "Board"
placement = "split"
command = ["target/release/herdr-worker", "board"]

[[actions]]
id = "open-board"
title = "Open Board"
contexts = ["global"]
command = ["target/release/herdr-worker", "act", "open-board"]
